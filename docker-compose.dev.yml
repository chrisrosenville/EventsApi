services:
  eventsapi:
    build:
      context: .
      dockerfile: EventsApi/Dockerfile.dev
    ports:
        - "8000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ./EventsApi:/app/EventsApi # Mount source code for hot reload
    depends_on:
      - db
    networks:
        - app-network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventsdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
        - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
       PGADMIN_DEFAULT_EMAIL: admin@example.com
       PGADMIN_DEFAULT_PASSWORD: admin
       PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
        - app-network

networks:
    app-network:
      driver: bridge

volumes:
    db_data: {}
    pgadmin_data: {}
